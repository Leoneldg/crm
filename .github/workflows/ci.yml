# Lint, tipos, pruebas y build en cada push y en cada Pull Request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Hasta que se suba un package-lock.json, se instala con npm install.
      - name: Instalar
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: solo-para-compilar-no-se-usa-en-produccion-1234567890
